[settings]
activate_aggressive = true
color_theme = "catppuccin"
experimental = true
idiomatic_version_file_enable_tools = ["python", "node", "java", "ruby", "go"]
lockfile = true
# Go
go_set_gobin = true
go_set_gopath = true
go_set_goroot = true

[tools]
go = "latest"
