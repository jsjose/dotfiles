# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json
notARepository: "quit"
os:
  editPreset: zed
git:
  parseEmoji: true
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
  log:
    order: "topo-order"
    showGraph: "always"
    showWholeGraph: false
  allBranchesLogCmds:
    - git log --graph --branches --color=always --abbrev-commit --decorate --date=relative --pretty=medium
customCommands:
  - key: T
    description: Git Town Menu
    commandMenu:
      - key: h
        context: global
        description: Hack from main
        prompts:
          - type: input
            title: "New feature branch name (off main):"
            key: BranchName
        command: "git town hack {{.Form.BranchName | quote}}"
        output: popup
      - key: a
        context: global
        description: Append to current branch
        prompts:
          - type: input
            title: "New child branch name:"
            key: BranchName
        command: "git town append {{.Form.BranchName | quote}}"
        output: popup
      - key: n
        context: global
        description: Navigate branches
        command: git town switch
        output: terminal
      - key: s
        description: Sync
        commandMenu:
          - key: s
            context: global
            description: Current stack and push
            command: git town sync --stack --push
            output: log
            loadingText: Syncing Git Town stack
          - key: a
            context: global
            description: All branches and push
            command: git town sync --all --push
            output: log
            loadingText: Syncing all Git Town branches
      - key: p
        context: localBranches
        description: Propose pull request
        command: git town propose
        output: terminal
      - key: v
        context: global
        description: View branch hierarchy
        command: git town branch
        output: popup
        loadingText: Listing Git Town branches
      - key: c
        context: global
        description: Continue after conflict
        command: git town continue
        output: terminal
      - key: u
        context: global
        description: Undo last Git Town command
        command: git town undo
        output: terminal
      - key: d
        context: localBranches
        description: Delete current branch
        command: git town delete
        output: terminal
  - key: ;
    description: GitHub Stack Menu
    commandMenu:
      - key: i
        context: global
        description: Initialize a stack
        command: gh stack init
        output: terminal
      - key: a
        context: global
        description: Add a layer
        prompts:
          - type: input
            title: "New stack branch name:"
            key: BranchName
        command: "gh stack add {{.Form.BranchName | quote}}"
        output: popup
      - key: o
        context: global
        description: Open an existing stack
        command: gh stack checkout
        output: terminal
      - key: n
        context: global
        description: Navigate current stack
        command: gh stack switch
        output: terminal
      - key: s
        context: global
        description: Sync stack
        command: gh stack sync
        output: terminal
        after:
          checkForConflicts: true
      - key: p
        context: global
        description: Submit pull requests
        command: gh stack submit
        output: terminal
      - key: v
        context: global
        description: View stack layers
        command: gh stack view
        output: popup
        loadingText: Listing GitHub stack layers
      - key: r
        context: global
        description: Rebase stack
        command: gh stack rebase
        output: terminal
        after:
          checkForConflicts: true
      - key: c
        context: global
        description: Continue a rebase
        command: gh stack rebase --continue
        output: terminal
gui:
  nerdFontsVersion: "3"
  showIcons: true
  showFileTree: true
  showNumstatInFilesView: true
  showCommandLog: true
  filterMode: fuzzy
  animateExplosion: true
  enlargedSideViewLocation: top
  # https://github.com/catppuccin/lazygit/blob/main/themes/mocha/sky.yml
  theme:
    activeBorderColor:
      - "#89dceb"
      - bold
    inactiveBorderColor:
      - "#a6adc8"
    searchingActiveBorderColor:
      - "#f9e2af"
    optionsTextColor:
      - "#89b4fa"
    selectedLineBgColor:
      - "#313244"
    inactiveViewSelectedLineBgColor:
      - "#6c7086"
    cherryPickedCommitFgColor:
      - "#89dceb"
    cherryPickedCommitBgColor:
      - "#45475a"
    markedBaseCommitFgColor:
      - "#89b4fa"
    markedBaseCommitBgColor:
      - "#f9e2af"
    unstagedChangesColor:
      - "#f38ba8"
    defaultFgColor:
      - "#cdd6f4"
  authorColors:
    "*": "#b4befe"
